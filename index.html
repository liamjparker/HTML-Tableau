<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Documentation Report Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  /* ── VARIABLES ──────────────────────────────────────────── */
  :root {
    --bg:      #111111;
    --surface: #1a1a1a;
    --surface2:#242424;
    --accent:  #ffffff;
    --muted:   #888888;
    --border:  #333333;
    --text:    #d0d0d0;
    --success: #4caf82;
    --radius:  8px;
    --shadow:  0 4px 24px rgba(0,0,0,0.5);
    --serif:   Georgia, 'Times New Roman', serif;
    --sans:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    --mono:    'Courier New', Courier, monospace;
  }

  /* ── RESET ──────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── APP SHELL (screen only) ────────────────────────────── */
  @media screen {
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 32px 48px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .app-header .logo-mark {
      width: 48px; height: 48px;
      background: #ffffff;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-family: var(--serif);
      font-size: 22px; font-weight: 700;
      color: #111111;
    }
    .app-header h1 {
      font-family: var(--serif);
      font-size: 22px; font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .app-header p {
      font-size: 13px; color: var(--muted); margin-top: 2px;
    }

    /* ── UPLOAD ZONE ─────────────────────────────────────── */
    .upload-zone {
      max-width: 760px;
      margin: 48px auto;
      padding: 0 24px;
    }
    .drop-area {
      border: 2px dashed var(--border);
      border-radius: 16px;
      background: var(--surface);
      padding: 60px 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }
    .drop-area:hover, .drop-area.drag-over {
      border-color: #ffffff;
      background: rgba(255,255,255,0.04);
    }
    .drop-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon {
      width: 56px; height: 56px;
      background: #ffffff;
      border-radius: 14px;
      margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .drop-icon svg { width: 26px; height: 26px; color: #111111; fill: none; stroke: currentColor; stroke-width: 2; }
    .drop-area h2 {
      font-family: var(--serif);
      font-size: 20px; font-weight: 600;
      color: #ffffff; margin-bottom: 8px;
    }
    .drop-area p { color: var(--muted); font-size: 13px; }
    .drop-area .format-badge {
      display: inline-block; margin-top: 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #cccccc;
      font-family: var(--mono);
      font-size: 11px; padding: 4px 12px; border-radius: 100px;
    }

    /* ── TABS EXPECTED ───────────────────────────────────── */
    .tab-list {
      display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap;
    }
    .tab-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 100px; padding: 6px 14px;
      font-size: 12px; color: var(--muted);
    }
    .tab-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
    .tab-pill.found { border-color: rgba(76,175,130,0.5); color: var(--success); }
    .tab-pill.found .dot { background: var(--success); }

    /* ── STATUS ──────────────────────────────────────────── */
    .status-bar {
      max-width: 760px; margin: 0 auto 24px; padding: 0 24px;
      display: none;
    }
    .status-bar.show { display: block; }
    .status-card {
      background: rgba(76,175,130,0.1);
      border: 1px solid rgba(76,175,130,0.3);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
      color: var(--success); font-size: 13px;
    }

    /* ── ACTIONS ─────────────────────────────────────────── */
    .actions {
      max-width: 760px; margin: 0 auto 48px; padding: 0 24px;
      display: none;
    }
    .actions.show { display: flex; gap: 12px; }
    .btn {
      padding: 12px 28px; border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 14px; font-weight: 500;
      border: none; cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-primary {
      background: #ffffff;
      color: #111111; font-weight: 600;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,255,255,0.15); }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }

    /* ── PREVIEW PANEL ───────────────────────────────────── */
    .preview-wrapper {
      max-width: 960px; margin: 0 auto 64px; padding: 0 24px;
    }
    .preview-label {
      font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      color: var(--muted); text-transform: uppercase; margin-bottom: 12px;
      font-family: var(--mono);
    }
    .preview-frame {
      background: #cccccc;
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow);
    }
  }

  /* ---------------------------------------------------------
     PDF / PRINT DOCUMENT STYLES
  --------------------------------------------------------- */

  #report {
    font-family: var(--sans);
    font-size: 11pt;
    line-height: 1.6;
    color: #111111;
    background: #fff;
  }

  /* ── COVER PAGE ──────────────────────────────────────── */
  .cover-page {
    background: #111111;
    min-height: 297mm;
    padding: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    page-break-after: always;
  }
  .cover-accent-bar {
    height: 6px;
    background: #ffffff;
  }
  .cover-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .cover-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px 56px;
    position: relative;
    z-index: 1;
  }
  .cover-tag {
    font-family: var(--mono);
    font-size: 10pt;
    color: #999999;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .cover-title {
    font-family: var(--serif);
    font-size: 42pt;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.1;
    letter-spacing: -1px;
    margin-top: 16px;
    max-width: 480px;
  }
  .cover-title span { color: #cccccc; }
  .cover-subtitle {
    font-size: 13pt;
    color: #777777;
    margin-top: 16px;
    font-weight: 300;
  }
  .cover-divider {
    width: 64px; height: 2px;
    background: #ffffff;
    margin: 32px 0;
  }
  .cover-meta-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    max-width: 420px;
  }
  .cover-meta-item label {
    display: block;
    font-size: 9pt;
    color: #888888;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .cover-meta-item span {
    display: block;
    font-size: 12pt;
    color: #dddddd;
    font-weight: 400;
  }
  .cover-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 24px;
  }
  .cover-footer-logo {
    font-family: var(--serif);
    font-size: 13pt;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
  }
  .cover-date {
    font-family: var(--mono);
    font-size: 9pt;
    color: rgba(255,255,255,0.25);
  }

  /* ── TOC PAGE ────────────────────────────────────────── */
  .toc-page {
    padding: 56px 72px;
    page-break-after: always;
    background: #fff;
  }
  .toc-header { margin-bottom: 40px; }
  .section-eyebrow {
    font-family: var(--mono);
    font-size: 9pt;
    color: #555555;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .section-title {
    font-family: var(--serif);
    font-size: 26pt;
    font-weight: 700;
    color: #111111;
    letter-spacing: -0.5px;
  }
  .title-bar {
    width: 48px; height: 3px;
    background: #111111;
    margin-top: 12px; border-radius: 2px;
  }
  .toc-entries { margin-top: 32px; }
  .toc-entry {
    display: flex;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid #e8e8e8;
  }
  .toc-num {
    font-family: var(--serif);
    font-size: 11pt;
    color: #333333;
    font-weight: 600;
    width: 36px;
    flex-shrink: 0;
  }
  .toc-name {
    font-family: var(--sans);
    font-size: 13pt;
    color: #111111;
    font-weight: 500;
    flex: 1;
  }
  .toc-desc {
    font-size: 10pt;
    color: #777777;
    display: block;
    font-weight: 400;
    margin-top: 2px;
  }
  .toc-dots {
    flex: 1;
    border-bottom: 1px dotted #aaaaaa;
    margin: 0 12px;
    min-width: 20px;
    align-self: center;
  }
  .toc-pg {
    font-family: var(--mono);
    font-size: 10pt;
    color: #111111;
    font-weight: 500;
    flex-shrink: 0;
  }

  /* ── CONTENT SECTIONS ────────────────────────────────── */
  .content-section {
    padding: 56px 72px;
    page-break-after: always;
    background: #fff;
  }
  .content-section:last-child { page-break-after: auto; }

  .section-header {
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 2px solid #e8e8e8;
    position: relative;
  }
  .section-header::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 0;
    width: 80px; height: 2px;
    background: #111111;
  }

  /* ── SUMMARY CARDS ───────────────────────────────────── */
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 24px;
  }
  .summary-card {
    background: #f8f8f8;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
  }
  .summary-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: #111111;
  }
  .summary-card.full-width { grid-column: 1 / -1; }
  .summary-card label {
    display: block;
    font-size: 9pt;
    color: #555555;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .summary-card .value {
    font-size: 13pt;
    color: #111111;
    font-weight: 600;
    font-family: var(--serif);
  }
  .summary-card .desc {
    font-size: 10.5pt;
    color: #444444;
    line-height: 1.6;
    margin-top: 4px;
  }

  /* ── DATA TABLES ─────────────────────────────────────── */
  .report-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 24px;
    font-size: 10pt;
  }
  .report-table thead tr { background: #111111; }
  .report-table thead th {
    padding: 12px 16px;
    text-align: left;
    font-family: var(--sans);
    font-size: 9pt;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: none;
  }
  .report-table tbody tr { border-bottom: 1px solid #e8e8e8; }
  .report-table tbody tr:nth-child(even) { background: #f8f8f8; }
  .report-table tbody td {
    padding: 12px 16px;
    color: #111111;
    vertical-align: top;
    line-height: 1.5;
  }
  .report-table tbody td.mono {
    font-family: var(--mono);
    font-size: 9pt;
    color: #222222;
    background: #f4f4f4;
  }
  .report-table .col-name { font-weight: 600; color: #111111; }
  .report-table .col-comments { color: #555555; font-style: italic; }

  /* ── BADGE / PILLS ───────────────────────────────────── */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 8.5pt;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .badge-blue   { background: #e8e8e8; color: #111111; }
  .badge-green  { background: #e0e0e0; color: #111111; }
  .badge-amber  { background: #d8d8d8; color: #111111; }
  .badge-slate  { background: #f0f0f0; color: #444444; border: 1px solid #dddddd; }
  .badge-red    { background: #e4e4e4; color: #333333; }

  /* ── FORMULA FIELD HIGHLIGHT ─────────────────────────── */
  .field-ref { color: #f97316; font-weight: 600; }

  /* ── CHANGELOG SPECIFIC ──────────────────────────────── */
  .changelog-entry {
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 12px;
    position: relative;
    background: #fff;
  }
  .changelog-entry::before {
    content: '';
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 3px;
    background: #333333;
    border-radius: 0 2px 2px 0;
  }
  .changelog-entry .cl-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 6px;
  }
  .changelog-entry .cl-date {
    font-family: var(--mono);
    font-size: 9pt; color: #777777; font-weight: 500;
  }
  .changelog-entry .cl-dashboard {
    font-weight: 600; color: #111111; font-size: 10.5pt;
  }
  .changelog-entry .cl-comment {
    font-size: 10pt; color: #444444; line-height: 1.5;
  }

  /* ── PAGE FOOTER ─────────────────────────────────────── */
  .page-footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .page-footer .footer-brand {
    font-family: var(--serif);
    font-size: 10pt;
    color: #333333;
    font-weight: 600;
  }
  .page-footer .footer-tag {
    font-family: var(--mono);
    font-size: 8pt;
    color: #aaaaaa;
    letter-spacing: 0.5px;
  }

  /* ── EMPTY STATE ─────────────────────────────────────── */
  .empty-row td {
    text-align: center;
    color: #aaaaaa;
    font-style: italic;
    padding: 24px !important;
  }

  /* ── COUNT BADGE ─────────────────────────────────────── */
  .count-badge {
    display: inline-flex; align-items: center; justify-content: center;
    background: #eeeeee;
    border: 1px solid #cccccc;
    color: #333333;
    font-family: var(--mono);
    font-size: 9pt; font-weight: 600;
    padding: 3px 10px; border-radius: 100px;
    margin-left: 10px; vertical-align: middle;
  }

  /* ── PRINT RULES ─────────────────────────────────────── */
  @media print {
    body { background: #fff !important; }
    .app-header, .upload-zone, .status-bar, .actions, .preview-label, .preview-frame { display: none !important; }
    #report { display: block !important; }
    .cover-page { min-height: 297mm; }
    .content-section, .toc-page { padding: 40px 56px; }
    .report-table { font-size: 9.5pt; }
    thead { display: table-header-group; }
    tr { page-break-inside: avoid; }
    .changelog-entry { page-break-inside: avoid; }
    @page { size: A4; margin: 0; }
  }

  /* ── SCREEN: hide report until loaded ───────────────── */
  @media screen {
    #report { display: none; }
    #report.visible { display: block; }
    .preview-frame #report { display: block !important; }
  }
</style>
</head>
<body>

<!-- APP SHELL -->
<header class="app-header">
  <div class="logo-mark">D</div>
  <div>
    <h1>Dashboard Report Generator</h1>
    <p>Upload your Excel workbook · Preview the report · Export to PDF</p>
  </div>
</header>

<div class="upload-zone">
  <div class="drop-area" id="dropArea">
    <input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm" />
    <div class="drop-icon">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <h2>Drop your Excel file here</h2>
    <p>or click to browse from your device</p>
    <span class="format-badge">.xlsx · .xls · .xlsm</span>
  </div>

  <div class="tab-list" id="tabList">
    <div class="tab-pill" id="pill-summary"><span class="dot"></span> Summary</div>
    <div class="tab-pill" id="pill-datasource"><span class="dot"></span> Data Source</div>
    <div class="tab-pill" id="pill-calculations"><span class="dot"></span> Calculations</div>
    <div class="tab-pill" id="pill-changelog"><span class="dot"></span> Change Log</div>
  </div>
</div>

<div class="status-bar" id="statusBar">
  <div class="status-card">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg>
    <span id="statusText">File loaded successfully.</span>
  </div>
</div>

<div class="actions" id="actionsBar">
  <button class="btn btn-primary" onclick="printReport()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6,9 6,2 18,2 18,9"/><path d="M6,18H4a2,2,0,0,1-2-2V11a2,2,0,0,1,2-2H20a2,2,0,0,1,2,2v5a2,2,0,0,1-2,2H18"/><rect x="6" y="14" width="12" height="8"/></svg>
    Export PDF
  </button>
  <button class="btn btn-ghost" onclick="clearReport()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="1,4 1,10 7,10"/><path d="M3.51,15A9,9,0,1,0,5.64,5.64L1,10"/></svg>
    Upload new file
  </button>
</div>

<!-- REPORT PREVIEW -->
<div class="preview-wrapper" id="previewWrapper" style="display:none">
  <div class="preview-label">REPORT PREVIEW</div>
  <div class="preview-frame">
    <div id="report"></div>
  </div>
</div>


<script>
/* ── helpers ─────────────────────────────────────────── */
const $ = id => document.getElementById(id);

function safe(val) {
  if (val === undefined || val === null || val === '') return '—';
  return String(val).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* Escape then wrap [FieldName] references in orange spans */
function highlightBrackets(val) {
  if (val === undefined || val === null || val === '') return '—';
  const escaped = String(val)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return escaped.replace(/\[([^\]]*)\]/g, '<span class="field-ref">[$1]</span>');
}

function badgeType(type) {
  if (!type) return '<span class="badge badge-slate">—</span>';
  const t = String(type).toLowerCase();
  if (t.includes('new') || t.includes('add'))     return `<span class="badge badge-green">${safe(type)}</span>`;
  if (t.includes('fix') || t.includes('bug'))     return `<span class="badge badge-red">${safe(type)}</span>`;
  if (t.includes('update') || t.includes('edit')) return `<span class="badge badge-blue">${safe(type)}</span>`;
  if (t.includes('remove') || t.includes('del'))  return `<span class="badge badge-amber">${safe(type)}</span>`;
  return `<span class="badge badge-slate">${safe(type)}</span>`;
}

function badgeConn(type) {
  if (!type) return '<span class="badge badge-slate">—</span>';
  const t = String(type).toLowerCase();
  if (t.includes('api'))                                                 return `<span class="badge badge-blue">${safe(type)}</span>`;
  if (t.includes('sql') || t.includes('db') || t.includes('database'))  return `<span class="badge badge-green">${safe(type)}</span>`;
  if (t.includes('excel') || t.includes('csv') || t.includes('file'))   return `<span class="badge badge-amber">${safe(type)}</span>`;
  if (t.includes('share') || t.includes('point'))                        return `<span class="badge badge-slate">${safe(type)}</span>`;
  return `<span class="badge badge-slate">${safe(type)}</span>`;
}

function getDate() {
  return new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

/* ── sheet → row array ───────────────────────────────── */
function sheetToRows(sheet) {
  const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  if (!raw || raw.length < 2) return { headers: [], rows: [] };
  const headers = raw[0].map(h => String(h).trim());
  const rows = raw.slice(1).filter(r => r.some(c => c !== '' && c !== null && c !== undefined));
  return { headers, rows };
}

/* ── fuzzy find sheet ────────────────────────────────── */
function findSheet(wb, keywords) {
  const names = wb.SheetNames.map(n => ({ name: n, lower: n.toLowerCase().replace(/[^a-z]/g, '') }));
  for (const kw of keywords) {
    const match = names.find(n => n.lower.includes(kw));
    if (match) return wb.Sheets[match.name];
  }
  return null;
}

function setPill(id, found) {
  if (found) $(id).classList.add('found');
}

/* ── SUMMARY SECTION ─────────────────────────────────── */
function renderSummary(sheet) {
  if (!sheet) return `<p style="color:#777;font-style:italic;">No Summary tab found.</p>`;
  const { headers, rows } = sheetToRows(sheet);
  if (!rows.length) return `<p style="color:#777;font-style:italic;">Summary tab is empty.</p>`;

  const colMap = {};
  headers.forEach((h, i) => { colMap[h.toLowerCase().replace(/[^a-z]/g, '')] = i; });

  let html = '';
  rows.forEach(row => {
    const name    = row[colMap['dashboardname'] ?? colMap['name'] ?? 0] || '';
    const summary = row[colMap['summary'] ?? colMap['description'] ?? 1] || '';
    const dev     = row[colMap['developer'] ?? colMap['dev'] ?? colMap['author'] ?? 2] || '';
    const users   = row[colMap['mainusers'] ?? colMap['users'] ?? colMap['owner'] ?? 3] || '';

    html += `
      <div style="margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid #e8e8e8;">
        <div class="summary-grid">
          <div class="summary-card"><label>Dashboard Name</label><div class="value">${safe(name)}</div></div>
          <div class="summary-card"><label>Developer</label><div class="value">${safe(dev)}</div></div>
          <div class="summary-card full-width"><label>Overview / Summary</label><div class="desc">${safe(summary)}</div></div>
          <div class="summary-card full-width"><label>Main Users</label><div class="desc">${safe(users)}</div></div>
        </div>
      </div>`;
  });
  return html;
}

/* ── DATA SOURCE SECTION ─────────────────────────────── */
function renderDataSource(sheet) {
  if (!sheet) return `<p style="color:#777;font-style:italic;">No Data Source tab found.</p>`;
  const { headers, rows } = sheetToRows(sheet);

  let html = `
    <table class="report-table">
      <thead>
        <tr>
          <th style="width:20%">Data Source Name</th>
          <th style="width:16%">Connection Type</th>
          <th style="width:16%">Classification</th>
          <th style="width:16%">Update Frequency</th>
          <th>Comments</th>
        </tr>
      </thead>
      <tbody>`;

  if (!rows.length) {
    html += `<tr class="empty-row"><td colspan="5">No data source records found</td></tr>`;
  } else {
    const h = headers.map(x => x.toLowerCase().replace(/[^a-z]/g, ''));
    const idx = {
      name:           h.findIndex(x => x.includes('name') || x.includes('source')),
      conn:           h.findIndex(x => x.includes('connection') || x.includes('type') || x.includes('conn')),
      classification: h.findIndex(x => x.includes('classif')),
      freq:           h.findIndex(x => x.includes('freq') || x.includes('update') || x.includes('refresh')),
      comments:       h.findIndex(x => x.includes('comment') || x.includes('note') || x.includes('desc')),
    };
    /* fall back to positional defaults if header not found */
    if (idx.name < 0)           idx.name = 0;
    if (idx.conn < 0)           idx.conn = 1;
    if (idx.classification < 0) idx.classification = 2;
    if (idx.freq < 0)           idx.freq = 3;
    if (idx.comments < 0)       idx.comments = 4;

    rows.forEach(row => {
      html += `
        <tr>
          <td class="col-name">${safe(row[idx.name])}</td>
          <td>${badgeConn(row[idx.conn])}</td>
          <td><span class="badge badge-slate">${safe(row[idx.classification])}</span></td>
          <td><span class="badge badge-slate">${safe(row[idx.freq])}</span></td>
          <td class="col-comments">${safe(row[idx.comments])}</td>
        </tr>`;
    });
  }
  html += `</tbody></table>`;
  return html;
}

/* ── CALCULATIONS SECTION ────────────────────────────── */
function renderCalculations(sheet) {
  if (!sheet) return `<p style="color:#777;font-style:italic;">No Calculations tab found.</p>`;
  const { headers, rows } = sheetToRows(sheet);

  let html = `
    <table class="report-table">
      <thead>
        <tr>
          <th style="width:24%">Calculation Name</th>
          <th style="width:38%">Formula</th>
          <th>Comments</th>
        </tr>
      </thead>
      <tbody>`;

  if (!rows.length) {
    html += `<tr class="empty-row"><td colspan="3">No calculation records found</td></tr>`;
  } else {
    const h = headers.map(x => x.toLowerCase().replace(/[^a-z]/g, ''));
    const idx = {
      name:     h.findIndex(x => x.includes('name') || x.includes('calc')),
      formula:  h.findIndex(x => x.includes('formula') || x.includes('expression') || x.includes('logic')),
      comments: h.findIndex(x => x.includes('comment') || x.includes('note') || x.includes('desc')),
    };
    if (idx.name < 0)     idx.name = 0;
    if (idx.formula < 0)  idx.formula = 1;
    if (idx.comments < 0) idx.comments = 2;

    rows.forEach(row => {
      html += `
        <tr>
          <td class="col-name">${safe(row[idx.name])}</td>
          <td class="mono">${highlightBrackets(row[idx.formula])}</td>
          <td class="col-comments">${safe(row[idx.comments])}</td>
        </tr>`;
    });
  }
  html += `</tbody></table>`;
  return html;
}

/* ── CHANGELOG SECTION ───────────────────────────────── */
function renderChangelog(sheet) {
  if (!sheet) return `<p style="color:#777;font-style:italic;">No Change Log tab found.</p>`;
  const { headers, rows } = sheetToRows(sheet);
  if (!rows.length) return `<p style="color:#777;font-style:italic;">No change log records found.</p>`;

  const h = headers.map(x => x.toLowerCase().replace(/[^a-z]/g, ''));
  const idx = {
    dashboard: h.findIndex(x => x.includes('dashboard') || x.includes('report') || x.includes('name')),
    date:      h.findIndex(x => x.includes('date') || x.includes('time')),
    type:      h.findIndex(x => x.includes('type') || x.includes('category') || x.includes('change')),
    comments:  h.findIndex(x => x.includes('comment') || x.includes('note') || x.includes('desc')),
  };
  if (idx.dashboard < 0) idx.dashboard = 0;
  if (idx.date < 0)      idx.date = 1;
  if (idx.type < 0)      idx.type = 2;
  if (idx.comments < 0)  idx.comments = 3;

  let html = '';
  rows.forEach(row => {
    let dateVal = row[idx.date];
    if (typeof dateVal === 'number') {
      const d = new Date(Math.round((dateVal - 25569) * 86400 * 1000));
      dateVal = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    } else if (dateVal) {
      dateVal = String(dateVal);
    }
    html += `
      <div class="changelog-entry">
        <div class="cl-header">
          <span class="cl-dashboard">${safe(row[idx.dashboard])}</span>
          <span class="cl-date">${safe(dateVal)}</span>
          ${badgeType(row[idx.type])}
        </div>
        <div class="cl-comment">${safe(row[idx.comments])}</div>
      </div>`;
  });
  return html;
}

/* ── BUILD FULL REPORT HTML ──────────────────────────── */
function buildReport(wb, filename) {
  const sheetSummary   = findSheet(wb, ['summary']);
  const sheetData      = findSheet(wb, ['datasource','data source','data']);
  const sheetCalc      = findSheet(wb, ['calculation','calc']);
  const sheetChangelog = findSheet(wb, ['changelog','change log','change','log']);

  setPill('pill-summary',      !!sheetSummary);
  setPill('pill-datasource',   !!sheetData);
  setPill('pill-calculations', !!sheetCalc);
  setPill('pill-changelog',    !!sheetChangelog);

  let dashName = 'Dashboard';
  let developer = '—';
  if (sheetSummary) {
    const { rows, headers } = sheetToRows(sheetSummary);
    if (rows.length) {
      const h = headers.map(x => x.toLowerCase().replace(/[^a-z]/g, ''));
      const ni = h.findIndex(x => x.includes('name') || x.includes('dashboard'));
      const di = h.findIndex(x => x.includes('developer') || x.includes('dev') || x.includes('author'));
      if (rows[0][ni >= 0 ? ni : 0]) dashName  = rows[0][ni >= 0 ? ni : 0];
      if (rows[0][di >= 0 ? di : 2]) developer = rows[0][di >= 0 ? di : 2];
    }
  }

  const countCalc = sheetCalc      ? sheetToRows(sheetCalc).rows.length      : 0;
  const countData = sheetData      ? sheetToRows(sheetData).rows.length      : 0;
  const countLog  = sheetChangelog ? sheetToRows(sheetChangelog).rows.length : 0;

  return `
  <div class="cover-page">
    <div class="cover-accent-bar"></div>
    <div class="cover-grid"></div>
    <div class="cover-body">
      <div>
        <div class="cover-tag">Documentation Report</div>
        <h1 class="cover-title">${safe(dashName)}<br><span>Technical Spec</span></h1>
        <div class="cover-subtitle">Auto-generated from workbook data</div>
        <div class="cover-divider"></div>
        <div class="cover-meta-grid">
          <div class="cover-meta-item"><label>Developer</label><span>${safe(developer)}</span></div>
          <div class="cover-meta-item"><label>Generated</label><span>${getDate()}</span></div>
          <div class="cover-meta-item"><label>Calculations</label><span>${countCalc} entries</span></div>
          <div class="cover-meta-item"><label>Data Sources</label><span>${countData} connections</span></div>
        </div>
      </div>
      <div class="cover-footer">
        <div class="cover-footer-logo">Dashboard Docs</div>
        <div class="cover-date">${filename.toUpperCase()}</div>
      </div>
    </div>
  </div>

  <div class="toc-page">
    <div class="toc-header">
      <div class="section-eyebrow">Contents</div>
      <h2 class="section-title">Table of Contents</h2>
      <div class="title-bar"></div>
    </div>
    <div class="toc-entries">
      <div class="toc-entry">
        <span class="toc-num">01</span>
        <span class="toc-name">Summary<span class="toc-desc">Dashboard overview, developer, and user information</span></span>
        <span class="toc-dots"></span><span class="toc-pg">3</span>
      </div>
      <div class="toc-entry">
        <span class="toc-num">02</span>
        <span class="toc-name">Data Sources<span class="toc-desc">Connected data sources, types, and refresh schedules</span></span>
        <span class="toc-dots"></span><span class="toc-pg">4</span>
      </div>
      <div class="toc-entry">
        <span class="toc-num">03</span>
        <span class="toc-name">Calculations<span class="toc-desc">Formulas, business logic, and calculation definitions</span></span>
        <span class="toc-dots"></span><span class="toc-pg">5</span>
      </div>
      <div class="toc-entry">
        <span class="toc-num">04</span>
        <span class="toc-name">Change Log<span class="toc-desc">Revision history, updates, and modifications</span></span>
        <span class="toc-dots"></span><span class="toc-pg">6</span>
      </div>
    </div>
  </div>

  <div class="content-section">
    <div class="section-header">
      <div class="section-eyebrow">01 — Summary</div>
      <h2 class="section-title">Dashboard Overview</h2>
      <div class="title-bar"></div>
    </div>
    ${renderSummary(sheetSummary)}
    <div class="page-footer">
      <span class="footer-brand">Dashboard Docs</span>
      <span class="footer-tag">Generated ${getDate()} · Confidential</span>
    </div>
  </div>

  <div class="content-section">
    <div class="section-header">
      <div class="section-eyebrow">02 — Data Sources</div>
      <h2 class="section-title">Data Sources <span class="count-badge">${countData}</span></h2>
      <div class="title-bar"></div>
    </div>
    ${renderDataSource(sheetData)}
    <div class="page-footer">
      <span class="footer-brand">Dashboard Docs</span>
      <span class="footer-tag">Generated ${getDate()} · Confidential</span>
    </div>
  </div>

  <div class="content-section">
    <div class="section-header">
      <div class="section-eyebrow">03 — Calculations</div>
      <h2 class="section-title">Calculations <span class="count-badge">${countCalc}</span></h2>
      <div class="title-bar"></div>
    </div>
    ${renderCalculations(sheetCalc)}
    <div class="page-footer">
      <span class="footer-brand">Dashboard Docs</span>
      <span class="footer-tag">Generated ${getDate()} · Confidential</span>
    </div>
  </div>

  <div class="content-section">
    <div class="section-header">
      <div class="section-eyebrow">04 — Change Log</div>
      <h2 class="section-title">Change Log <span class="count-badge">${countLog}</span></h2>
      <div class="title-bar"></div>
    </div>
    ${renderChangelog(sheetChangelog)}
    <div class="page-footer">
      <span class="footer-brand">Dashboard Docs</span>
      <span class="footer-tag">Generated ${getDate()} · Confidential</span>
    </div>
  </div>
  `;
}

/* ── FILE HANDLER ────────────────────────────────────── */
function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });

      const reportEl = $('report');
      reportEl.innerHTML = buildReport(wb, file.name);
      reportEl.classList.add('visible');

      $('statusText').textContent = `"${file.name}" loaded — ${wb.SheetNames.length} tabs found.`;
      $('statusBar').classList.add('show');
      $('actionsBar').classList.add('show');
      $('previewWrapper').style.display = 'block';
      $('previewWrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      alert('Could not parse Excel file. Please ensure it is a valid .xlsx workbook.\n\n' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ── PRINT ───────────────────────────────────────────── */
function printReport() {
  const clone = $('report').cloneNode(true);
  clone.id = 'print-report';
  clone.style.display = 'block';
  document.body.appendChild(clone);

  const style = document.createElement('style');
  style.id = 'print-override';
  style.textContent = `@media print { body > *:not(#print-report) { display: none !important; } #print-report { display: block !important; } }`;
  document.head.appendChild(style);

  window.print();
  setTimeout(() => {
    document.body.removeChild(clone);
    document.head.removeChild(style);
  }, 1000);
}

/* ── CLEAR ───────────────────────────────────────────── */
function clearReport() {
  $('report').innerHTML = '';
  $('report').classList.remove('visible');
  $('statusBar').classList.remove('show');
  $('actionsBar').classList.remove('show');
  $('previewWrapper').style.display = 'none';
  $('fileInput').value = '';
  ['pill-summary','pill-datasource','pill-calculations','pill-changelog'].forEach(id => $(id).classList.remove('found'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── DRAG & DROP ─────────────────────────────────────── */
const dropArea = $('dropArea');
dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('drag-over'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('drag-over'));
dropArea.addEventListener('drop', e => {
  e.preventDefault();
  dropArea.classList.remove('drag-over');
  handleFile(e.dataTransfer.files[0]);
});
$('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));
</script>
