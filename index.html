<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Documentation Report Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root {
    --bg:      #111111;
    --surface: #1a1a1a;
    --muted:   #888888;
    --border:  #333333;
    --text:    #d0d0d0;
    --success: #4caf82;
    --radius:  8px;
    --shadow:  0 4px 24px rgba(0,0,0,0.5);
    --serif:   Georgia, 'Times New Roman', serif;
    --sans:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    --mono:    'Courier New', Courier, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── APP SHELL ──────────────────────────────────────────── */
  @media screen {
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 14px;
      line-height: 1.6; min-height: 100vh;
    }
    .app-header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 32px 48px; display: flex; align-items: center; gap: 24px;
    }
    .app-header .logo-mark {
      width: 48px; height: 48px; background: #fff; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      font-family: var(--serif); font-size: 22px; font-weight: 700; color: #111;
    }
    .app-header h1 { font-family: var(--serif); font-size: 22px; font-weight: 600; color: #fff; }
    .app-header p  { font-size: 13px; color: var(--muted); margin-top: 2px; }

    .upload-zone { max-width: 760px; margin: 48px auto; padding: 0 24px; }
    .drop-area {
      border: 2px dashed var(--border); border-radius: 16px;
      background: var(--surface); padding: 60px 40px; text-align: center;
      cursor: pointer; transition: all 0.25s ease; position: relative;
    }
    .drop-area:hover, .drop-area.drag-over { border-color: #fff; background: rgba(255,255,255,0.04); }
    .drop-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .drop-icon {
      width: 56px; height: 56px; background: #fff; border-radius: 14px;
      margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
    }
    .drop-icon svg { width: 26px; height: 26px; color: #111; fill: none; stroke: currentColor; stroke-width: 2; }
    .drop-area h2 { font-family: var(--serif); font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 8px; }
    .drop-area p  { color: var(--muted); font-size: 13px; }
    .drop-area .format-badge {
      display: inline-block; margin-top: 16px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      color: #ccc; font-family: var(--mono); font-size: 11px; padding: 4px 12px; border-radius: 100px;
    }

    .tab-list { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
    .tab-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 100px; padding: 6px 14px; font-size: 12px; color: var(--muted);
    }
    .tab-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
    .tab-pill.found { border-color: rgba(76,175,130,0.5); color: var(--success); }
    .tab-pill.found .dot { background: var(--success); }

    .status-bar { max-width: 760px; margin: 0 auto 24px; padding: 0 24px; display: none; }
    .status-bar.show { display: block; }
    .status-card {
      background: rgba(76,175,130,0.1); border: 1px solid rgba(76,175,130,0.3);
      border-radius: var(--radius); padding: 12px 16px;
      display: flex; align-items: center; gap: 10px; color: var(--success); font-size: 13px;
    }

    .actions { max-width: 760px; margin: 0 auto 48px; padding: 0 24px; display: none; }
    .actions.show { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      padding: 12px 28px; border-radius: var(--radius); font-family: var(--sans);
      font-size: 14px; font-weight: 500; border: none; cursor: pointer;
      transition: all 0.2s ease; display: flex; align-items: center; gap: 8px;
    }
    .btn-primary { background: #fff; color: #111; font-weight: 600; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,255,255,0.15); }
    .btn-word { background: #2b579a; color: #fff; font-weight: 600; }
    .btn-word:hover { transform: translateY(-1px); background: #3a6fc4; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }

    .preview-wrapper { max-width: 960px; margin: 0 auto 64px; padding: 0 24px; }
    .preview-label {
      font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      color: var(--muted); text-transform: uppercase; margin-bottom: 12px;
      font-family: var(--mono);
    }
    .preview-frame { background: #cccccc; border-radius: 12px; padding: 24px; box-shadow: var(--shadow); }
  }

  /* ── REPORT DOCUMENT ────────────────────────────────────── */
  #report { font-family: var(--sans); font-size: 11pt; line-height: 1.6; color: #111; background: #fff; }

  /* Cover page — clean white */
  .cover-page {
    background: #ffffff; min-height: 297mm; padding: 0;
    display: flex; flex-direction: column;
    page-break-after: always; border-top: 6px solid #111111;
  }
  .cover-body {
    flex: 1; display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px 56px;
  }
  .cover-tag {
    font-family: var(--mono); font-size: 10pt; color: #666666;
    letter-spacing: 2px; text-transform: uppercase;
  }
  .cover-title {
    font-family: var(--serif); font-size: 40pt; font-weight: 700;
    color: #111111; line-height: 1.1; letter-spacing: -1px;
    margin-top: 16px; max-width: 520px;
  }
  .cover-title span { color: #555555; font-size: 28pt; display: block; margin-top: 8px; }
  .cover-subtitle { font-size: 13pt; color: #777777; margin-top: 16px; }
  .cover-divider { width: 64px; height: 2px; background: #111111; margin: 32px 0; }
  .cover-meta-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; max-width: 420px; }
  .cover-meta-item label {
    display: block; font-size: 9pt; color: #555555;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; margin-bottom: 4px;
  }
  .cover-meta-item span { display: block; font-size: 12pt; color: #111111; font-weight: 500; }
  .cover-footer {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid #e0e0e0; padding-top: 24px;
  }
  .cover-footer-logo { font-family: var(--serif); font-size: 13pt; color: #aaaaaa; letter-spacing: 1px; }
  .cover-date { font-family: var(--mono); font-size: 9pt; color: #aaaaaa; }

  /* TOC */
  .toc-page { padding: 56px 72px; page-break-after: always; background: #fff; }
  .toc-header { margin-bottom: 40px; }
  .section-eyebrow {
    font-family: var(--mono); font-size: 9pt; color: #555555;
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;
  }
  .section-title { font-family: var(--serif); font-size: 26pt; font-weight: 700; color: #111111; }
  .title-bar { width: 48px; height: 3px; background: #111111; margin-top: 12px; border-radius: 2px; }
  .toc-entries { margin-top: 32px; }
  .toc-entry { display: flex; align-items: baseline; padding: 12px 0; border-bottom: 1px solid #e8e8e8; }
  .toc-num { font-family: var(--serif); font-size: 11pt; color: #333333; font-weight: 600; width: 36px; flex-shrink: 0; }
  .toc-name { font-family: var(--sans); font-size: 13pt; color: #111111; font-weight: 500; flex: 1; }
  .toc-desc { font-size: 10pt; color: #777777; display: block; font-weight: 400; margin-top: 2px; }
  .toc-dots { flex: 1; border-bottom: 1px dotted #aaa; margin: 0 12px; min-width: 20px; align-self: center; }
  .toc-pg { font-family: var(--mono); font-size: 10pt; color: #111111; font-weight: 500; flex-shrink: 0; }

  /* Content sections */
  .content-section { padding: 56px 72px; page-break-after: always; background: #fff; }
  .content-section:last-child { page-break-after: auto; }
  .section-header {
    margin-bottom: 36px; padding-bottom: 24px; border-bottom: 2px solid #e8e8e8; position: relative;
  }
  .section-header::after {
    content: ''; position: absolute; bottom: -2px; left: 0; width: 80px; height: 2px; background: #111111;
  }

  /* Summary cards */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
  .summary-card {
    background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 8px;
    padding: 20px 24px; position: relative; overflow: hidden;
  }
  .summary-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #111111;
  }
  .summary-card.full-width { grid-column: 1 / -1; }
  .summary-card label {
    display: block; font-size: 9pt; color: #555555; letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 600; margin-bottom: 8px;
  }
  .summary-card .value { font-size: 13pt; color: #111111; font-weight: 600; font-family: var(--serif); }
  .summary-card .desc { font-size: 10.5pt; color: #444444; line-height: 1.6; margin-top: 4px; }

  /* Tables */
  .report-table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 10pt; }
  .report-table thead tr { background: #111111; }
  .report-table thead th {
    padding: 12px 16px; text-align: left; font-family: var(--sans);
    font-size: 9pt; font-weight: 600; color: #ffffff;
    letter-spacing: 1px; text-transform: uppercase; border: none;
  }
  .report-table tbody tr { border-bottom: 1px solid #e8e8e8; }
  .report-table tbody tr:nth-child(even) { background: #f8f8f8; }
  .report-table tbody td { padding: 12px 16px; color: #111111; vertical-align: top; line-height: 1.5; }
  .report-table tbody td.mono { font-family: var(--mono); font-size: 9pt; color: #222222; background: #f4f4f4; }
  .report-table .col-name { font-weight: 600; color: #111111; }
  .report-table .col-comments { color: #555555; font-style: italic; }

  /* Badges */
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 100px;
    font-size: 8.5pt; font-weight: 600; letter-spacing: 0.5px;
  }
  .badge-blue  { background: #e8e8e8; color: #111111; }
  .badge-green { background: #e0e0e0; color: #111111; }
  .badge-amber { background: #d8d8d8; color: #111111; }
  .badge-slate { background: #f0f0f0; color: #444444; border: 1px solid #dddddd; }
  .badge-red   { background: #e4e4e4; color: #333333; }

  /* Orange field highlighting */
  .field-ref { color: #f97316; font-weight: 600; }

  /* Changelog */
  .changelog-entry {
    border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px 20px;
    margin-bottom: 12px; position: relative; background: #fff;
  }
  .changelog-entry::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 3px; background: #333333; border-radius: 0 2px 2px 0;
  }
  .changelog-entry .cl-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .changelog-entry .cl-date { font-family: var(--mono); font-size: 9pt; color: #777777; font-weight: 500; }
  .changelog-entry .cl-dashboard { font-weight: 600; color: #111111; font-size: 10.5pt; }
  .changelog-entry .cl-comment { font-size: 10pt; color: #444444; line-height: 1.5; }

  /* Count badge */
  .count-badge {
    display: inline-flex; align-items: center; justify-content: center;
    background: #eeeeee; border: 1px solid #cccccc; color: #333333;
    font-family: var(--mono); font-size: 9pt; font-weight: 600;
    padding: 3px 10px; border-radius: 100px; margin-left: 10px; vertical-align: middle;
  }

  .empty-row td { text-align: center; color: #aaaaaa; font-style: italic; padding: 24px !important; }

  /* Print */
  @media print {
    body { background: #fff !important; }
    .app-header, .upload-zone, .status-bar, .actions, .preview-label, .preview-frame { display: none !important; }
    #report { display: block !important; }
    .cover-page { min-height: 297mm; }
    .content-section, .toc-page { padding: 40px 56px; }
    .report-table { font-size: 9.5pt; }
    thead { display: table-header-group; }
    tr { page-break-inside: avoid; }
    .changelog-entry { page-break-inside: avoid; }
    @page { size: A4; margin: 0; }
  }
  @media screen {
    #report { display: none; }
    #report.visible { display: block; }
    .preview-frame #report { display: block !important; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="logo-mark">D</div>
  <div>
    <h1>Dashboard Report Generator</h1>
    <p>Upload your Excel workbook · Preview the report · Export to PDF or Word</p>
  </div>
</header>

<div class="upload-zone">
  <div class="drop-area" id="dropArea">
    <input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm" />
    <div class="drop-icon">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <h2>Drop your Excel file here</h2>
    <p>or click to browse from your device</p>
    <span class="format-badge">.xlsx · .xls · .xlsm</span>
  </div>
  <div class="tab-list" id="tabList">
    <div class="tab-pill" id="pill-summary"><span class="dot"></span> Summary</div>
    <div class="tab-pill" id="pill-datasource"><span class="dot"></span> Data Source</div>
    <div class="tab-pill" id="pill-calculations"><span class="dot"></span> Calculations</div>
    <div class="tab-pill" id="pill-changelog"><span class="dot"></span> Change Log</div>
  </div>
</div>

<div class="status-bar" id="statusBar">
  <div class="status-card">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg>
    <span id="statusText">File loaded successfully.</span>
  </div>
</div>

<div class="actions" id="actionsBar">
  <button class="btn btn-primary" onclick="printReport()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6,9 6,2 18,2 18,9"/><path d="M6,18H4a2,2,0,0,1-2-2V11a2,2,0,0,1,2-2H20a2,2,0,0,1,2,2v5a2,2,0,0,1-2,2H18"/><rect x="6" y="14" width="12" height="8"/></svg>
    Export PDF
  </button>
  <button class="btn btn-word" onclick="exportWord()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>
    Export Word
  </button>
  <button class="btn btn-ghost" onclick="clearReport()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="1,4 1,10 7,10"/><path d="M3.51,15A9,9,0,1,0,5.64,5.64L1,10"/></svg>
    Upload new file
  </button>
</div>

<div class="preview-wrapper" id="previewWrapper" style="display:none">
  <div class="preview-label">REPORT PREVIEW</div>
  <div class="preview-frame">
    <div id="report"></div>
  </div>
</div>


<script>
const $ = id => document.getElementById(id);

/* stored workbook reference for Word export */
let lastWb = null;
let lastFilename = '';

/* ── helpers ─────────────────────────────────────────── */
function safe(val) {
  if (val === undefined || val === null || val === '') return '—';
  return String(val).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* Escape then highlight [Field] references in orange */
function highlightBrackets(val, inline) {
  if (val === undefined || val === null || val === '') return '—';
  const escaped = String(val).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const spanStyle = inline
    ? 'style="color:#f97316;font-weight:600;"'
    : 'class="field-ref"';
  return escaped.replace(/\[([^\]]*)\]/g, `<span ${spanStyle}>[$1]</span>`);
}

function badgeType(type, inline) {
  if (!type) return badge('—', '#f0f0f0', '#444', inline);
  const t = String(type).toLowerCase();
  if (t.includes('new')  || t.includes('add'))    return badge(safe(type), '#e0e0e0', '#111', inline);
  if (t.includes('fix')  || t.includes('bug'))    return badge(safe(type), '#e4e4e4', '#333', inline);
  if (t.includes('update')|| t.includes('edit'))  return badge(safe(type), '#e8e8e8', '#111', inline);
  if (t.includes('remove')|| t.includes('del'))   return badge(safe(type), '#d8d8d8', '#111', inline);
  return badge(safe(type), '#f0f0f0', '#444', inline);
}

function badgeConn(type, inline) {
  if (!type) return badge('—', '#f0f0f0', '#444', inline);
  const t = String(type).toLowerCase();
  if (t.includes('api'))                                                return badge(safe(type), '#e8e8e8', '#111', inline);
  if (t.includes('sql')||t.includes('db')||t.includes('database'))     return badge(safe(type), '#e0e0e0', '#111', inline);
  if (t.includes('excel')||t.includes('csv')||t.includes('file'))      return badge(safe(type), '#d8d8d8', '#111', inline);
  if (t.includes('share')||t.includes('point'))                         return badge(safe(type), '#f0f0f0', '#444', inline);
  return badge(safe(type), '#f0f0f0', '#444', inline);
}

function badge(text, bg, color, inline) {
  if (inline) {
    return `<span style="display:inline-block;padding:2px 8px;border-radius:100px;background:${bg};color:${color};font-size:8.5pt;font-weight:600;">${text}</span>`;
  }
  return `<span class="badge badge-slate">${text}</span>`;
}

function getDate() {
  return new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
}

/* ── sheet utilities ─────────────────────────────────── */
function sheetToRows(sheet) {
  const raw = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
  if (!raw || raw.length < 2) return { headers:[], rows:[] };
  const headers = raw[0].map(h => String(h).trim());
  const rows = raw.slice(1).filter(r => r.some(c => c !== '' && c !== null && c !== undefined));
  return { headers, rows };
}

function findSheet(wb, keywords) {
  const names = wb.SheetNames.map(n => ({ name:n, lower:n.toLowerCase().replace(/[^a-z]/g,'') }));
  for (const kw of keywords) {
    const m = names.find(n => n.lower.includes(kw));
    if (m) return wb.Sheets[m.name];
  }
  return null;
}

function setPill(id, found) { if (found) $(id).classList.add('found'); }

/* column index helpers — fall back to positional default */
function colIdx(h, matchers, fallback) {
  const i = h.findIndex(x => matchers.some(m => x.includes(m)));
  return i >= 0 ? i : fallback;
}

/* ── Section renderers (for PDF preview) ────────────── */
function renderSummary(sheet) {
  if (!sheet) return `<p style="color:#777;font-style:italic;">No Summary tab found.</p>`;
  const { headers, rows } = sheetToRows(sheet);
  if (!rows.length) return `<p style="color:#777;font-style:italic;">Summary tab is empty.</p>`;
  const h = headers.map(x => x.toLowerCase().replace(/[^a-z]/g,''));
  let html = '';
  rows.forEach(row => {
    const name    = row[colIdx(h,['dashboardname','name'],0)] || '';
    const summary = row[colIdx(h,['summary','description'],1)] || '';
    const dev     = row[colIdx(h,['developer','dev','author'],2)] || '';
    const users   = row[colIdx(h,['mainusers','users','owner'],3)] || '';
    html += `
      <div style="margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid #e8e8e8;">
        <div class="summary-grid">
          <div class="summary-card"><label>Dashboard Name</label><div class="value">${safe(name)}</div></div>
          <div class="summary-card"><label>Developer</label><div class="value">${safe(dev)}</div></div>
          <div class="summary-card full-width"><label>Overview / Summary</label><div class="desc">${safe(summary)}</div></div>
          <div class="summary-card full-width"><label>Main Users</label><div class="desc">${safe(users)}</div></div>
        </div>
      </div>`;
  });
  return html;
}

function renderDataSource(sheet) {
  if (!sheet) return `<p style="color:#777;font-style:italic;">No Data Source tab found.</p>`;
  const { headers, rows } = sheetToRows(sheet);
  const h = headers.map(x => x.toLowerCase().replace(/[^a-z]/g,''));
  const idx = {
    name:  colIdx(h,['name','source'],0),
    conn:  colIdx(h,['connection','type','conn'],1),
    cls:   colIdx(h,['classif'],2),
    freq:  colIdx(h,['freq','update','refresh'],3),
    notes: colIdx(h,['comment','note','desc'],4),
  };
  let html = `
    <table class="report-table"><thead><tr>
      <th style="width:18%">Data Source</th>
      <th style="width:15%">Connection</th>
      <th style="width:14%">Classification</th>
      <th style="width:14%">Frequency</th>
      <th>Comments</th>
    </tr></thead><tbody>`;
  if (!rows.length) {
    html += `<tr class="empty-row"><td colspan="5">No records found</td></tr>`;
  } else {
    rows.forEach(row => {
      html += `<tr>
        <td class="col-name">${safe(row[idx.name])}</td>
        <td>${badgeConn(row[idx.conn], false)}</td>
        <td><span class="badge badge-slate">${safe(row[idx.cls])}</span></td>
        <td><span class="badge badge-slate">${safe(row[idx.freq])}</span></td>
        <td class="col-comments">${safe(row[idx.notes])}</td>
      </tr>`;
    });
  }
  return html + `</tbody></table>`;
}

function renderCalculations(sheet) {
  if (!sheet) return `<p style="color:#777;font-style:italic;">No Calculations tab found.</p>`;
  const { headers, rows } = sheetToRows(sheet);
  const h = headers.map(x => x.toLowerCase().replace(/[^a-z]/g,''));
  const idx = {
    name:    colIdx(h,['name','calc'],0),
    formula: colIdx(h,['formula','expression','logic'],1),
    notes:   colIdx(h,['comment','note','desc'],2),
  };
  let html = `
    <table class="report-table"><thead><tr>
      <th style="width:16%">Name</th>
      <th style="width:55%">Formula</th>
      <th>Comments</th>
    </tr></thead><tbody>`;
  if (!rows.length) {
    html += `<tr class="empty-row"><td colspan="3">No records found</td></tr>`;
  } else {
    rows.forEach(row => {
      html += `<tr>
        <td class="col-name">${safe(row[idx.name])}</td>
        <td class="mono">${highlightBrackets(row[idx.formula], false)}</td>
        <td class="col-comments">${safe(row[idx.notes])}</td>
      </tr>`;
    });
  }
  return html + `</tbody></table>`;
}

function renderChangelog(sheet) {
  if (!sheet) return `<p style="color:#777;font-style:italic;">No Change Log tab found.</p>`;
  const { headers, rows } = sheetToRows(sheet);
  if (!rows.length) return `<p style="color:#777;font-style:italic;">No records found.</p>`;
  const h = headers.map(x => x.toLowerCase().replace(/[^a-z]/g,''));
  const idx = {
    dashboard: colIdx(h,['dashboard','report','name'],0),
    date:      colIdx(h,['date','time'],1),
    type:      colIdx(h,['type','category','change'],2),
    notes:     colIdx(h,['comment','note','desc'],3),
  };
  let html = '';
  rows.forEach(row => {
    let dateVal = row[idx.date];
    if (typeof dateVal === 'number') {
      const d = new Date(Math.round((dateVal - 25569) * 86400 * 1000));
      dateVal = d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    } else { dateVal = String(dateVal || ''); }
    html += `
      <div class="changelog-entry">
        <div class="cl-header">
          <span class="cl-dashboard">${safe(row[idx.dashboard])}</span>
          <span class="cl-date">${safe(dateVal)}</span>
          ${badgeType(row[idx.type], false)}
        </div>
        <div class="cl-comment">${safe(row[idx.notes])}</div>
      </div>`;
  });
  return html;
}

/* ── File handler ────────────────────────────────────── */
function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb   = XLSX.read(data, { type:'array', cellDates:true });

      lastWb       = wb;
      lastFilename = file.name;

      const reportEl   = $('report');
      reportEl.innerHTML = buildReport(wb, file.name);
      reportEl.classList.add('visible');

      $('statusText').textContent = `"${file.name}" loaded — ${wb.SheetNames.length} tabs found.`;
      $('statusBar').classList.add('show');
      $('actionsBar').classList.add('show');
      $('previewWrapper').style.display = 'block';
      $('previewWrapper').scrollIntoView({ behavior:'smooth', block:'start' });
    } catch (err) {
      alert('Could not parse file.\n\n' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ── Print (PDF) ─────────────────────────────────────── */
function printReport() {
  const clone = $('report').cloneNode(true);
  clone.id = 'print-report';
  clone.style.display = 'block';
  document.body.appendChild(clone);

  const s = document.createElement('style');
  s.id = 'print-override';
  s.textContent = `@media print { body > *:not(#print-report) { display:none!important; } #print-report { display:block!important; } }`;
  document.head.appendChild(s);

  window.print();
  setTimeout(() => {
    document.body.removeChild(clone);
    document.head.removeChild(s);
  }, 1000);
}

/* ── Clear ───────────────────────────────────────────── */
function clearReport() {
  lastWb = null; lastFilename = '';
  $('report').innerHTML = '';
  $('report').classList.remove('visible');
  $('statusBar').classList.remove('show');
  $('actionsBar').classList.remove('show');
  $('previewWrapper').style.display = 'none';
  $('fileInput').value = '';
  ['pill-summary','pill-datasource','pill-calculations','pill-changelog'].forEach(id => $(id).classList.remove('found'));
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ── Drag & drop ─────────────────────────────────────── */
const dropArea = $('dropArea');
dropArea.addEventListener('dragover',  e => { e.preventDefault(); dropArea.classList.add('drag-over'); });
dropArea.addEventListener('dragleave', ()  => dropArea.classList.remove('drag-over'));
dropArea.addEventListener('drop', e => {
  e.preventDefault();
  dropArea.classList.remove('drag-over');
  handleFile(e.dataTransfer.files[0]);
});
$('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));
</script>
